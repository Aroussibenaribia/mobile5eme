name: mobile5eme
description: "HomeFix - Plateforme de Services A Domicile & Forum Entraide"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  crypto: ^3.0.7
  path: ^1.9.0
  provider: ^6.1.2
  share_plus: ^10.0.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  mailer: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# Windows tests and desktop use the SQLite supplied by Windows.
# Android keeps the package's bundled native library and sqflite plugin.
hooks:
  user_defines:
    sqlite3:
      source:
        windows: system
      name:
        windows: winsqlite3
